[project]
name = "cmugpt-sms-surface"
revision = "1.0"

[providers]
openbao = "openbao://secrets.scottylabs.org/secret"

[defaults]
providers = ["openbao"]

[profiles.default]
BLUEBUBBLES_URL = { description = "BlueBubbles server URL", required = false }
BLUEBUBBLES_PASSWORD = { description = "BlueBubbles server password", required = false }
BLUEBUBBLES_CHAT_GUID = { description = "Default chat to send from", required = false }
AGENT_API_URL = { description = "Bark agent respond endpoint", required = false }
AGENT_API_KEY = { description = "Shared secret for the Bark agent API", required = false }
CMU_KEYCLOAK_URL = { description = "Keycloak base URL", required = false }
CMU_KEYCLOAK_CLIENT_ID = { description = "Keycloak OIDC client ID", required = false }
CMU_KEYCLOAK_CLIENT_SECRET = { description = "Keycloak OIDC client secret", required = false }

[profiles.dev]
DEBUG = { description = "Enable FastAPI debug mode and uvicorn reload", default = "true", required = false }

[profiles.prod]

[profiles.staging]

[profiles.preview]
